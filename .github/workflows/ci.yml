name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      - run: npm run compile

      - run: npm run lint

      - name: Run tests (Linux, via xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm test

      - name: Run tests
        if: runner.os != 'Linux'
        run: npm test
